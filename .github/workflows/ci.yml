name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: lectorbit_frontend/pnpm-lock.yaml
      - name: Validate provenance metadata
        run: >-
          python scripts/release/verify_provenance.py
          --manifest-dir lectorbit_backend/sidecars/manifests
          --model-catalog lectorbit_backend/crates/lectorbit_ai/model-catalog.json
      - name: Test release tooling
        run: python -m unittest discover -s scripts/release/tests -v
      - name: Install frontend dependencies
        working-directory: lectorbit_frontend
        run: pnpm install --frozen-lockfile
      - name: Format check
        working-directory: lectorbit_frontend
        run: >-
          pnpm exec prettier --check package.json eslint.config.js vite.config.ts wdio.conf.mjs e2e
          src/main.tsx src/ipc/updates.ts src/ipc/updates.test.ts
          src/routes/settings/SettingsRoute.tsx
      - name: Lint and typecheck
        working-directory: lectorbit_frontend
        run: pnpm lint && pnpm typecheck
      - name: Unit and component tests
        working-directory: lectorbit_frontend
        run: pnpm test
      - name: Production frontend build
        working-directory: lectorbit_frontend
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lectorbit_backend
      - name: Install Tauri Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Rust format
        working-directory: lectorbit_backend
        run: cargo fmt --all --check
      - name: Rust lint
        working-directory: lectorbit_backend
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust unit and integration tests
        working-directory: lectorbit_backend
        run: cargo test --workspace --locked

  desktop-smoke:
    needs: [frontend-and-provenance, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: lectorbit_frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lectorbit_backend
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: lectorbit_frontend
        run: pnpm install --frozen-lockfile
      - name: Enable debug-only WebDriver capability
        run: >-
          python -c "from pathlib import Path; import shutil;
          shutil.copyfile(Path('lectorbit_frontend/e2e/capability.e2e.json'),
          Path('lectorbit_backend/src-tauri/capabilities/e2e.json'))"
      - name: Build E2E renderer
        working-directory: lectorbit_frontend
        env:
          VITE_E2E: "true"
        run: pnpm build
      - name: Build debug desktop app with embedded WebDriver
        working-directory: lectorbit_backend
        run: cargo build --locked --package lectorbit --features e2e
      - name: Desktop E2E smoke
        working-directory: lectorbit_frontend
        run: pnpm test:e2e

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: lectorbit_backend/Cargo.toml
          command: check
          command-arguments: advisories licenses bans sources
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: lectorbit-source.spdx.json
          upload-artifact: true
