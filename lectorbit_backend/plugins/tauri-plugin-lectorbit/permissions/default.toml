# Generated command permissions are composed explicitly here. The renderer has
# no generic filesystem, shell, process, or SQL permission.

[default]
description = "Default LectorBit permissions for the main window"
permissions = [
  "allow-app-get-version",
  "allow-app-get-diagnostics",
  "allow-library-list-roots",
  "allow-library-pick-and-register-root",
  "allow-library-revoke-root",
  "allow-library-enqueue-scan",
  "allow-library-list-scan-jobs",
]
