  "allow-app-get-diagnostics",
  "allow-library-list-roots",
  "allow-library-pick-and-register-root",
  "allow-library-revoke-root",
  "allow-library-enqueue-scan",
  "allow-library-list-scan-jobs",
  "allow-library-list-media",
  "allow-planner-list-candidates",
  "allow-planner-preview",
  "allow-plan-commit",
  "allow-plan-get-routine",
  "allow-plan-replan",
  "allow-playback-get-capability",
  "allow-playback-open",
  "allow-playback-play",
  "allow-playback-pause",
  "allow-playback-seek",
  "allow-playback-set-speed",
  "allow-playback-get-state",
  "allow-playback-close",
  "allow-study-record-action",
  "allow-models-list",
  "allow-models-install",
  "allow-models-remove",
  "allow-analysis-start-transcription",
  "allow-analysis-get-transcript-state",
  "allow-analysis-list-jobs",
  "allow-search-query",
