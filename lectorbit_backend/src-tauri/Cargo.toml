[package]
name = "lectorbit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "LectorBit desktop shell (Tauri 2)."

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "lectorbit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lectorbit"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-lectorbit = { workspace = true }
lectorbit_core = { workspace = true }
lectorbit_db = { workspace = true }
lectorbit_services = { workspace = true }
lectorbit_media = { workspace = true }
lectorbit_playback = { workspace = true }
lectorbit_ai = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service"] }

[dev-dependencies]
tempfile = { workspace = true }
